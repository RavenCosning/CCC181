services:
  db:
    image: postgres:17
    container_name: trimline-db
    environment:
      POSTGRES_USER: trimline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trimline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimline -d trimline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: